version: '3.8'

# Minimal test stack for the sysmlv2 service tests. Only the dependencies
# the in-process sysmlv2 module needs are included here:
#   - quad-store-server: triplestore that layer1 reads/writes
#   - layer1-service:    Flexo MMS Layer 1, the upstream HTTP service that
#                        sysmlv2 forwards requests to
#
# The sysmlv2 service itself is NOT containerised for tests — it runs
# in-process via Ktor's testApplication.
#
# A login service is also NOT included; tests use a hardcoded JWT token
# signed with the same secret as the layer1-service container (see
# test.env).
#
# Each test clears the triplestore, reloads cluster.trig (from this
# directory) and recreates the sysmlv2 org on layer1 in beforeEach
# (see CommonSpec).

services:

  quad-store-server:
    image: atomgraph/fuseki:4.7
    hostname: quad-server
    container_name: flexo-sysmlv2-test-quad-server
    command: --mem --update /ds
    ports:
      - 3030:3030

  layer1-service:
    image: openmbee/flexo-mms-layer1-service:v0.2.2
    hostname: layer1-service
    container_name: flexo-sysmlv2-test-layer1-service
    env_file:
      - ./test.env
    environment:
      - FLEXO_MMS_ROOT_CONTEXT=http://layer1-service
      - FLEXO_MMS_QUERY_URL=http://quad-server:3030/ds/sparql
      - FLEXO_MMS_UPDATE_URL=http://quad-server:3030/ds/update
      - FLEXO_MMS_GRAPH_STORE_PROTOCOL_URL=http://quad-server:3030/ds/data
    depends_on:
      - quad-store-server
    ports:
      - 8080:8080

networks:
  default:
    name: flexo-sysmlv2-test-network
    driver: bridge
