ktor {
  deployment {
    environment = development
    port = 8083
    autoreload = true
    watch = [ org.openmbee.flexo.sysmlv2 ]
  }

  application {
    modules = [ org.openmbee.flexo.sysmlv2.AppMainKt.module ]
  }
}

flexo {
    protocol = "http"
    protocol = ${?FLEXO_PROTOCOL}
    host = "localhost"
    host = ${?FLEXO_HOST}
    port = "8080"
    port = ${?FLEXO_PORT}
    org = "sysmlv2"
    org = ${?FLEXO_SYSMLV2_ORG}
    defaultTimeout = "1800"
    defaultTimeout = ${?FLEXO_DEFAULT_TIMEOUT}
    auth = ""
    auth = ${?FLEXO_AUTH}
    # host:port of a running OpenSysML sysml-grpc service; empty disables
    # textual-notation input/output
    opensysml {
        url = ""
        url = ${?FLEXO_OPENSYSML_URL}
        # validation of the model a commit would leave at the branch head, through the
        # same service: "off" (default), "warn" (commit proceeds, diagnostics answered in
        # X-SysML-Diagnostic headers) or "reject" (a model with errors is refused with 422);
        # "warn" and "reject" need url to be set. A request may raise the level with
        # ?validate=warn|reject, never lower it.
        validate = "off"
        validate = ${?FLEXO_OPENSYSML_VALIDATE}
    }
}

# JWT configuration must match the layer1-service container in
# src/test/resources/docker-compose.yml so the hardcoded test token
# (see Auth.kt / Requests.kt) is accepted by layer1.
jwt {
    domain = "http://flexo-mms-services"
    domain = ${?JWT_DOMAIN}
    audience = "flexo-mms-audience"
    audience = ${?JWT_AUDIENCE}
    realm = "flexo-mms"
    realm = ${?JWT_REALM}
    secret = "thisissomethingreallylong1234567801234567890"
    secret = ${?JWT_SECRET}
}

# Layer1 SPARQL endpoints used by CommonSpec.beforeEach to drop all
# graphs and reload cluster.trig before each test.
flexoMmsTest {
    queryUrl = "http://localhost:3030/ds/sparql"
    queryUrl = ${?FLEXO_MMS_QUERY_URL}
    updateUrl = "http://localhost:3030/ds/update"
    updateUrl = ${?FLEXO_MMS_UPDATE_URL}
    graphStoreProtocolUrl = "http://localhost:3030/ds/data"
    graphStoreProtocolUrl = ${?FLEXO_MMS_GRAPH_STORE_PROTOCOL_URL}
}
